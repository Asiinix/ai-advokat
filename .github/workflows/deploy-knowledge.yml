name: Deploy knowledge services

on:
  push:
    branches:
      - main
    paths:
      - "services/knowledge/**"
      - ".github/workflows/deploy-knowledge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-knowledge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - prg-indexer
          - prg-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Railway
        working-directory: services/knowledge
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          npx -y @railway/cli@latest up
          --service ${{ matrix.service }}
          --project 7ce66bd1-6a7b-48f4-8dc6-d831beb2eda4
          --environment production
          --ci
          --yes
