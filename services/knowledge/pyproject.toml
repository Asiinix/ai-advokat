[project]
name = "prg-knowledge-service"
version = "0.1.0"
description = "Elasticsearch indexer and MCP server for the PRG legal document collection"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.28.1,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["knowledge_service"]
